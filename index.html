<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window Washers</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="TemplateData/icon-192.png">
<meta name="theme-color" content="#14181f">
<style>
html, body { margin: 0; height: 100%; background: #14181f; overflow: hidden; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
#cover { position: fixed; inset: 0; display: flex; align-items: flex-end; background: #14181f url("TemplateData/loading.jpg") center / cover no-repeat; }
#cover.done { display: none; }
#strip { width: 100%; padding: 18px 6vw 22px; background: rgba(20, 24, 31, 0.88); color: #f4f1e8; font: 600 15px/1.3 system-ui, sans-serif; }
#track { height: 14px; border-radius: 7px; overflow: hidden; background: rgba(255, 255, 255, 0.14); }
#fill { width: 0; height: 100%; background: #ffc928; transition: width 0.2s; }
#word { min-height: 1.3em; margin-top: 10px; }
</style>
</head>
<body>
<canvas id="game" tabindex="-1"></canvas>
<div id="cover">
  <div id="strip">
    <div id="track" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100"><div id="fill"></div></div>
    <div id="word">Loading the tower…</div>
  </div>
</div>
<script>
  var canvas = document.getElementById("game");
  var cover = document.getElementById("cover");
  var fill = document.getElementById("fill");
  var track = document.getElementById("track");
  var word = document.getElementById("word");
  var config = {
    dataUrl: "Build/7935b4e69d09a7bacaa012ac6a49d96e.data.unityweb",
    frameworkUrl: "Build/81542685f81dacba261ec5a776faa160.framework.js.unityweb",
    codeUrl: "Build/f021f96c5a3071582af2c26bff2e1149.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "Picnic Games",
    productName: "Window Washers",
    productVersion: "1.0",
    devicePixelRatio: 1,
    showBanner: function (message, type) {
      if (type === "error") word.textContent = message;
    }
  };
  var loader = document.createElement("script");
  loader.src = "Build/5604f49dfe1e9aff50a8bb89dff648ee.loader.js";
  loader.onload = function () {
    createUnityInstance(canvas, config, function (progress) {
      var percent = Math.round(progress * 100);
      fill.style.width = percent + "%";
      track.setAttribute("aria-valuenow", percent);
    }).then(function () {
      cover.classList.add("done");
      canvas.focus();
    }).catch(function (problem) {
      word.textContent = "The game could not start: " + problem;
    });
  };
  loader.onerror = function () {
    word.textContent = "The game files did not load. Check the connection and reload.";
  };
  document.body.appendChild(loader);
</script>
</body>
</html>
